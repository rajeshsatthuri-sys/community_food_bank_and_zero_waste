<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GreenShare</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-header">

            <a href="index.html" class="auth-logo">
                🌱 GreenShare
            </a>

            <p>
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>


        <div class="auth-card login-card">

            <h1>Welcome back!</h1>

            <p class="subtitle">
                Login to continue to your GreenShare account.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword('loginPassword')"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="remember-row">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login →
                </button>


                <p
                    id="loginMessage"
                    class="message"
                ></p>

            </form>


            <div class="register-prompt">

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>


<script src="auth.js"></script>

</body>

</html>
