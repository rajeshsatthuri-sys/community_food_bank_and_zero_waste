<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | GreenShare</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-header">

            <a href="index.html" class="auth-logo">
                🌱 GreenShare
            </a>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>


        <div class="auth-card">

            <h1>Create your account</h1>

            <p class="subtitle">
                Join the GreenShare community.
            </p>


            <!-- ACCOUNT TYPE -->

            <h2>Choose account type</h2>

            <p class="helper">
                Select how you want to participate.
            </p>


            <div class="role-grid">

                <label class="role-option">

                    <input
                        type="radio"
                        name="role"
                        value="donor"
                        checked
                    >

                    <span>
                        🍱 <strong>Food Donor</strong>
                        <small>Donate surplus food</small>
                    </span>

                </label>


                <label class="role-option">

                    <input
                        type="radio"
                        name="role"
                        value="farmer"
                    >

                    <span>
                        🚜 <strong>Farmer</strong>
                        <small>Manage farm waste</small>
                    </span>

                </label>


                <label class="role-option">

                    <input
                        type="radio"
                        name="role"
                        value="beneficiary"
                    >

                    <span>
                        🤝 <strong>Beneficiary</strong>
                        <small>Request food support</small>
                    </span>

                </label>

            </div>


            <!-- FORM -->

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address *
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="+91 XXXXX XXXXX"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="location">
                        Location *
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="City / District"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password *
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword('password')"
                        >
                            👁
                        </button>

                    </div>

                    <small>
                        Use at least 8 characters.
                    </small>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password *
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword('confirmPassword')"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- FARMER INFORMATION -->

                <div
                    id="farmerInformation"
                    class="extra-section"
                    style="display:none;"
                >

                    <h2>Farmer Information</h2>

                    <p class="helper">
                        Additional information for agricultural
                        waste management.
                    </p>


                    <div class="form-group">

                        <label for="farmName">
                            Farm Name
                        </label>

                        <input
                            type="text"
                            id="farmName"
                            placeholder="Enter farm name"
                        >

                    </div>


                    <div class="form-group">

                        <label for="crop">
                            Main Crop
                        </label>

                        <select id="crop">

                            <option value="">
                                Select crop
                            </option>

                            <option>Rice</option>
                            <option>Wheat</option>
                            <option>Cotton</option>
                            <option>Maize</option>
                            <option>Vegetables</option>
                            <option>Fruits</option>
                            <option>Other</option>

                        </select>

                    </div>

                </div>


                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </span>

                </label>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account →
                </button>


                <p
                    id="registerMessage"
                    class="message"
                ></p>

            </form>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>


<script src="auth.js"></script>

</body>

</html>
